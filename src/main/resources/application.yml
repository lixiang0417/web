server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lab_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: mysql

  # ✅ Redis 配置（必须正确缩进）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

dashscope:
  api-key: ${AI_DASHSCOPE_API_KEY}
  model: qwen3.7-plus

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl